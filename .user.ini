; PHP Configuration for File Uploads
; This file should be placed in the Laravel root directory (same level as public folder)
; cPanel will automatically read this file and apply these settings

; Maximum file upload size
upload_max_filesize = 50M

; Maximum POST data size (must be larger than upload_max_filesize)
post_max_size = 60M

; Maximum execution time for scripts (in seconds)
max_execution_time = 300

; Maximum input time for scripts (in seconds)
max_input_time = 300

; Maximum memory limit
memory_limit = 256M

